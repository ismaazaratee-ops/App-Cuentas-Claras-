<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cuentas Claras — Ordená tu plata y tu negocio</title>
<meta name="description" content="Salí de deudas, armá tu presupuesto y llevá las cuentas de tu negocio, todo en un solo lugar." />

<!-- PWA: permite "Agregar a pantalla de inicio" en Android -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1B2A4A" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<!-- Tailwind (CDN, requiere conexión la primera vez que se abre) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin: 0; padding: 0; background: #FAFAF8; }
  #root { min-height: 100vh; }
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; }
</style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#1B2A4A;">
      Cargando…
    </div>
  </div>

  <script src="./bundle.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
